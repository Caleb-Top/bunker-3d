<div id="bunker-viewer">
  <div class="viz-row"><span class="viz-badge">五层深埋模型</span><span class="text-small">B1 无人机间与 B4 维修间 · 独立枪械储存</span></div>
  <div class="viz-controls" id="floor-controls" aria-label="查看楼层">
    <button class="btn" data-floor="all" aria-pressed="true">整体</button>
    <button class="btn" data-floor="0" aria-pressed="false">B1 车库与生活</button>
    <button class="btn" data-floor="1" aria-pressed="false">B2 医疗休闲</button>
    <button class="btn" data-floor="2" aria-pressed="false">B3 农业</button>
    <button class="btn" data-floor="3" aria-pressed="false">B4 仓储</button>
    <button class="btn" data-floor="4" aria-pressed="false">B5 水电</button>
  </div>
  <div class="viz-controls">
    <label class="form-label">楼层展开 <output id="gap-value">6</output><input id="gap" class="form-range" type="range" min="0" max="14" value="6"></label>
    <label class="form-check"><input id="rock" class="form-check-input" type="checkbox" checked><span class="form-check-label">深埋岩层</span></label>
    <label class="form-check"><input id="labels" class="form-check-input" type="checkbox" checked><span class="form-check-label">空间标注</span></label>
    <label class="form-check"><input id="route" class="form-check-input" type="checkbox" checked><span class="form-check-label">无人机转运路线</span></label>
    <button id="home" class="btn">总览视角</button><button id="top" class="btn">俯视</button>
  </div>
  <div class="viz-controls"><button id="walk-toggle" class="btn" aria-pressed="false">进入第一人称</button><button id="walk-up" class="btn" disabled>电梯：上一层</button><button id="walk-down" class="btn" disabled>电梯：下一层</button><span id="walk-status" class="text-small">剖面模式</span></div>
  <div id="model-stage"><canvas id="model-canvas" tabindex="0" aria-label="堡垒三维模型。剖面模式拖动旋转；漫游模式拖动转头，WASD 或方向键移动，Escape 返回剖面。"></canvas><div id="model-labels" aria-hidden="true"></div><div id="model-message" role="status">正在构建三维空间…</div></div>
  <div id="walk-pad" class="viz-controls" hidden><button class="btn" data-move="forward">前进 ↑</button><button class="btn" data-move="left">左移 ←</button><button class="btn" data-move="back">后退 ↓</button><button class="btn" data-move="right">右移 →</button><span class="text-small">拖动画面转头 · WASD 移动 · 房门靠近自动开启 · Esc 退出</span></div>
  <div class="viz-controls"><label class="form-label">选择空间<select class="form-select" id="room-select"><option value="">点击模型或选择空间</option></select></label><button class="btn" id="focus-room">聚焦所选空间</button><button class="btn" id="export-model">导出 OBJ 模型</button><button class="btn" id="export-image">保存当前视角</button></div>
  <div class="viz-controls"><label class="form-label">选择物品<select class="form-select" id="item-select"><option value="">点击车辆、家具或设备</option></select></label><button id="blast-door" class="btn" aria-pressed="false">开合车库隔断门</button></div>
  <section id="item-inspector" class="card" hidden><div id="item-title"></div><p id="item-description" class="text-small"></p><div class="viz-controls"><label class="form-label">替换款式<select id="item-variant" class="form-select"><option value="0">原始款式</option><option value="1">替换款式</option></select></label><label class="form-label">外观<select id="item-color" class="form-select"><option value="original">原始配色</option><option value="slate">石墨灰</option><option value="olive">橄榄绿</option><option value="sand">砂岩色</option></select></label><button id="item-apply" class="btn">应用替换</button><button id="item-reset" class="btn">恢复此物品</button><button id="item-focus" class="btn">近看物品</button></div><span id="item-save-status" class="text-small">替换仅保存在本浏览器；可随 OBJ 导出。</span></section>
  <p id="room-detail" aria-live="polite">拖动旋转 · 滚轮缩放 · 右键拖动平移 · 双指缩放 · 点击房间查看说明</p>
  <p class="text-small">深埋空间概念模型；枪械仅作柜内外形展示。尺寸、埋深、结构、防护等级和 200 年保障能力均未核算。</p>
</div>
<style>
#bunker-viewer{--stage-bg:var(--background);width:100%;color:var(--foreground)}
#bunker-viewer [hidden]{display:none!important}
#bunker-viewer .viz-controls{margin-block:12px}#model-stage{position:relative;height:650px;overflow:hidden;background:var(--stage-bg)}
#model-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#model-canvas:active{cursor:grabbing}
#model-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.model-tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:var(--foreground);background:var(--background);padding:3px 6px;border:1px solid var(--border);border-radius:3px;font-size:12px}
#model-message{position:absolute;inset:45% 12% auto;text-align:center;pointer-events:none;color:var(--foreground)}
#room-detail{min-height:2.8em}#bunker-viewer select{max-width:100%}@media(max-width:650px){#model-stage{height:500px}.model-tag{font-size:11px}#bunker-viewer .viz-controls{gap:8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  'use strict';
  const root=document.getElementById('bunker-viewer'), $=id=>root.querySelector('#'+id);
  if(!window.THREE){$('model-message').textContent='三维组件未能加载。请使用完整离线包打开。';return;}
  const T=window.THREE, canvas=$('model-canvas'), stage=$('model-stage');
  let renderer;
  try{renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});}catch(e){$('model-message').textContent='浏览器未能启用 WebGL，请开启硬件加速后重新打开。';return;}
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
  const scene=new T.Scene(), model=new T.Group();scene.add(model);
  const camera=new T.PerspectiveCamera(38,1,.1,1800), light=new T.DirectionalLight(0xfff0d8,2.7);light.position.set(-50,120,100);scene.add(light,new T.HemisphereLight(0xd7ebff,0x72624d,2.5));
  const fill=new T.DirectionalLight(0xa4c9ff,1.3);fill.position.set(80,35,-50);scene.add(fill);
  const palette={slab:0x667785,wall:0xb4b6af,metal:0x374b5b,wood:0xa0764c,blue:0x3688af,green:0x467e55,yellow:0xe4b955,cloth:0xe0c8a2,dark:0x20303d};
  const mats=new Map();function mat(c){if(!mats.has(c))mats.set(c,new T.MeshStandardMaterial({color:c,roughness:c===palette.metal?.42:.75,metalness:c===palette.metal?.45:.12}));return mats.get(c);}
  const doors=[],walkWalls=[],ceilings=[],floorRoomLists=[[],[],[],[],[]],items=[];
  function registerItem(group,type,label){let a=group.parent,floor=0,roomId=null;while(a){if(a.userData.room!==undefined)roomId=a.userData.room;if(a.userData.floor!==undefined)floor=a.userData.floor;a=a.parent;}const item={id:String(items.length),group,type,label,floor,roomId,variant:0,color:'original'};group.userData.itemId=item.id;items.push(item);return group;}
  function itemGroup(p,x,z,type,label){const g=new T.Group();g.position.set(x,0,z);g.name=type+'-'+items.length;p.add(g);return registerItem(g,type,label);}
  const boxGeo=new T.BoxGeometry(1,1,1), cylGeo=new T.CylinderGeometry(1,1,1,24), sphereGeo=new T.SphereGeometry(1,12,8);
  function box(p,x,y,z,w,h,d,c){const m=new T.Mesh(boxGeo,mat(c));m.position.set(x,y,z);m.scale.set(w,h,d);p.add(m);return m;}
  function cyl(p,x,y,z,r,h,c){const m=new T.Mesh(cylGeo,mat(c));m.position.set(x,y,z);m.scale.set(r,h,r);p.add(m);if(p.userData.room!==undefined&&r>=1&&h>=1)registerItem(m,'tank','储罐／处理容器');return m;}
  function ball(p,x,y,z,r,c){const m=new T.Mesh(sphereGeo,mat(c));m.position.set(x,y,z);m.scale.setScalar(r);p.add(m);return m;}
  function pipe(p,a,b,r,c){const av=new T.Vector3(...a),bv=new T.Vector3(...b),delta=bv.clone().sub(av);const m=cyl(p,0,0,0,r,delta.length(),c);m.position.copy(av.add(bv).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());return m;}
  function door(p,x,z,w=2.1){const frame=new T.Group();frame.name='automatic-compartment-door';frame.position.set(x,0,z);p.add(frame);const leaves=[];for(const side of [-1,1]){const leaf=new T.Group();leaf.position.x=side*w/4;frame.add(leaf);box(leaf,0,1.45,0,w/2-.03,2.9,.28,palette.metal);box(leaf,0,1.45,.17,w/2-.18,2.5,.05,0x526777);box(leaf,-side*w*.13,1.4,.25,.08,.5,.08,palette.yellow);leaf.traverse(o=>o.userData.walkDoor=true);leaves.push({group:leaf,side,base:side*w/4});}box(frame,0,3,0,w+.35,.18,.6,palette.wall);for(const dx of [-w/2-.1,w/2+.1])box(frame,dx,1.5,0,.16,3,.6,palette.wall);const sensor=box(frame,0,3.2,.15,.6,.14,.18,0x73b9a4);doors.push({frame,leaves,width:w,open:0,sensor});return frame;}
  function cutWall(p,x,z,w,d,h=3.6){const m=box(p,x,.8,z,w,1.6,d,palette.wall);walkWalls.push({mesh:m,height:h});return m;}
  function edge(p,x,y,z,w,h,d){const line=new T.LineSegments(new T.EdgesGeometry(boxGeo),new T.LineBasicMaterial({color:0x394b54,transparent:true,opacity:.24}));line.position.set(x,y,z);line.scale.set(w,h,d);p.add(line);}
  function firearmAlcove(parent,x,z,floorIndex){
    const a=new T.Group();a.name='firearm-storage-alcove';a.position.set(x,0,z);parent.add(a);a.userData.staticStorage=true;
    box(a,0,.17,0,6,.2,5.8,0x778682);for(const xx of [-3,3])box(a,xx,1.9,0,.2,3.8,5.8,palette.wall);box(a,0,1.9,-2.9,6,3.8,.25,palette.wall);
    // Generic external silhouettes only, without operating parts or assembly geometry.
    box(a,-.7,1.6,-1.8,3.9,3.2,1.1,palette.dark);
    for(let i=0;i<4;i++){const gun=new T.Group();gun.name='stored-firearm-silhouette';gun.position.set(-2.1+i*.92,.45,-1.12);a.add(gun);box(gun,0,.35,0,.23,.7,.13,0x7c6954);box(gun,0,1,0,.25,.65,.16,palette.metal);box(gun,0,1.72,0,.1,.95,.1,0x222a30);box(gun,.17,.86,0,.23,.16,.12,0x222a30);}
    const glass=new T.Mesh(boxGeo,new T.MeshPhysicalMaterial({color:0xa4c6cf,transparent:true,opacity:.16,roughness:.2,metalness:.2,depthWrite:false}));glass.position.set(-.7,1.6,-.98);glass.scale.set(3.65,2.9,.04);a.add(glass);
    for(const xx of [-2.65,1.25])box(a,xx,1.6,-.92,.12,3.2,.13,0x73878b);box(a,-.7,1.6,-.89,.1,3.2,.12,0x73878b);box(a,-.43,1.65,-.78,.12,.5,.1,palette.yellow);
    box(a,2,1,-1.7,1.25,2,1.3,palette.metal);for(const yy of [.55,1.4]){box(a,2,yy,-1.02,1,.65,.08,0x687f87);box(a,2.3,yy,-.94,.16,.09,.1,palette.yellow);}
    box(a,-1.9,1.85,2.9,2.2,3.7,.18,palette.wall);box(a,2,1.85,2.9,2,3.7,.18,palette.wall);door(a,0,2.9,1.6);
    tag('独立枪械储存',a,[0,4.2,0],floorIndex,parent.userData.room);
    return a;
  }
  const floors=[],rooms=[],tags=[],floorNames=['车库 · 无人机 · 总控 · 生活','医疗 · 休闲 · 训练','农业 · 育苗 · 水产','大型仓储 · 维修','储水 · 净化 · 能源'];
  const floorColors=[0xcfac69,0x9bafba,0x73a977,0xb49a77,0x5f9fbe];
  function tag(text,p,pos,floor,room=null){const el=document.createElement('span');el.className='model-tag';el.textContent=text;$('model-labels').append(el);tags.push({el,parent:p,position:new T.Vector3(...pos),floor,room});}
  function room(f,name,x,z,w,d,description){const g=new T.Group();g.name='B'+(f.userData.floor+1)+'_room_'+rooms.length;g.position.set(x,0,z);f.add(g);const item={id:String(rooms.length),name,floor:f.userData.floor,group:g,x,z,w,d,description};const roomHeight=(f.userData.floor===0||f.userData.floor===4)?6.2:4.4;g.userData.room=item.id;rooms.push(item);
    item.pad=box(g,0,.08,0,w,.16,d,floorColors[item.floor]);
    edge(g,0,.08,0,w,.16,d);for(const xx of [-w/2+.28,w/2-.28]){box(g,xx,.18,0,.1,.04,d-.6,0xd6c692);box(g,xx,3.8,-d/2+.2,.32,.16,.45,palette.yellow);}
    // Aligned front and rear portals connect the public and service corridors.
    for(const side of [-1,1]){const shared=f.userData.floor===0&&((name==='四车位重卡库'&&side===1)||(name==='独立无人机间'&&side===-1));if(shared){cutWall(g,side*w/2,-d/4-1,.22,d/2-2,roomHeight);cutWall(g,side*w/2,d/4+1,.22,d/2-2,roomHeight);}else cutWall(g,side*w/2,0,.18,d,roomHeight);}
    for(const zz of [-d/2,d/2]){cutWall(g,-w/4-.85,zz,w/2-1.7,.18,roomHeight);cutWall(g,w/4+.85,zz,w/2-1.7,.18,roomHeight);door(g,0,zz,3.2);}
    const roof=box(g,0,roomHeight+.12,0,w,.18,d,0xc8ceca);roof.visible=false;roof.userData.ceiling=true;ceilings.push(roof);floorRoomLists[item.floor].push(item);
    tag(name,g,[0,4.9,0],item.floor,item.id);return g;
  }
  function shelf(g,x,z,w=4,filled=true){g=itemGroup(g,x,z,'shelf','物资货架');g.userData.width=w;x=0;z=0;for(const xx of [-w/2,w/2])for(const zz of [-.65,.65])box(g,x+xx,1.7,z+zz,.1,3.4,.1,palette.metal);for(let k=0;k<3;k++){box(g,x,.45+k*1.15,z,w,.1,1.5,palette.metal);if(filled)for(let j=0;j<3;j++)box(g,x-w*.32+j*w*.32,.83+k*1.15,z,w*.25,.65,1.05,j%2?0xc8b28b:0x9d967c);}}
  function table(g,x,z,w=3,d=1.5){g=itemGroup(g,x,z,'table','工作台／桌');g.userData.width=w;g.userData.depth=d;x=0;z=0;box(g,x,1.25,z,w,.2,d,palette.wood);box(g,x,1.08,z,w-.25,.12,d-.15,0x556670);for(const xx of [-w*.4,w*.4])for(const zz of [-d*.35,d*.35]){box(g,x+xx,.65,z+zz,.13,1.2,.13,palette.metal);box(g,x+xx,.12,z+zz,.3,.12,.3,palette.dark);}}
  function seat(g,x,z){g=itemGroup(g,x,z,'seat','座椅');x=0;z=0;box(g,x,.65,z,1.1,.3,1.1,palette.dark);box(g,x,1.3,z-.48,1.1,1.2,.18,palette.dark);cyl(g,x,.35,z,.12,.7,palette.metal);for(const xx of [-.6,.6])box(g,xx,.9,0,.1,.15,.9,palette.metal);}
  function bed(g,x,z){g=itemGroup(g,x,z,'bed','床与床头柜');x=0;z=0;box(g,x,.45,z,2.9,.7,4.6,palette.wood);box(g,x,1.15,z-2.25,3,1.8,.2,palette.wood);box(g,x,.9,z,2.8,.35,4.4,palette.cloth);for(const xx of [-.65,.65])box(g,x+xx,1.16,z-1.55,1.12,.25,.8,0xf0eee6);box(g,x,1.1,z+.7,2.75,.14,2.7,0x9baa9e);box(g,x+2.1,.65,z-1.4,1.15,1.3,1.1,palette.wood);cyl(g,x+2.1,1.6,z-1.4,.12,.6,palette.metal);cyl(g,x+2.1,2,z-1.4,.4,.5,palette.cloth);}
  function truck(g,x,z){const v=new T.Group();v.name='heavy-truck';v.position.set(x,0,z);g.add(v);registerItem(v,'truck','大型重卡');box(v,0,1.1,0,3.4,.55,11.7,palette.dark);box(v,0,2.5,-1.4,3.6,2.8,8.5,0x94a29a);box(v,0,2.15,4.25,3.5,2.7,2.6,0xb8c3bd);box(v,0,2.7,5.59,2.95,.95,.05,0x28546b);box(v,0,1.4,5.64,2.7,.45,.12,palette.metal);for(const xx of [-1.8,1.8])for(const zz of [-4,-2,4.2]){const wh=cyl(v,xx,.86,zz,.78,.42,0x20262c);wh.rotation.z=Math.PI/2;}for(const xx of [-1.2,1.2])box(v,xx,1.65,5.65,.55,.3,.07,0xf3da8d);}
  function drone(g,x,z,s=1){const v=new T.Group();v.name='unarmed-drone';v.position.set(x,1.5,z);v.scale.setScalar(s);g.add(v);registerItem(v,'drone','无人机');box(v,0,0,0,.85,.35,1.2,palette.metal);for(const xx of [-1,1])for(const zz of [-1,1]){pipe(v,[0,0,0],[xx*1.3,0,zz*1.1],.08,palette.metal);const prop=cyl(v,xx*1.3,.12,zz*1.1,.65,.04,0x5c6e77);box(v,xx*.7,-.5,0,.07,.7,1.4,palette.metal);}return v;}
  function generator(g,x,z,s=1){const v=new T.Group();v.name='generator';v.position.set(x,0,z);v.scale.setScalar(s);g.add(v);registerItem(v,'generator','备用发电机');box(v,0,.3,0,3.4,.5,5,palette.dark);box(v,0,1.45,0,3,2.2,4.5,0x62735a);for(let k=0;k<5;k++)box(v,-.65+k*.32,1.5,2.27,.1,1.2,.03,palette.dark);box(v,.9,1.85,2.29,.6,.5,.06,0x365c72);pipe(v,[-1,2.4,-1],[-1,3.6,-1],.15,palette.metal);}
  function crop(g,x,z,w=4){g=itemGroup(g,x,z,'crop','立体种植架');g.userData.width=w;x=0;z=0;for(let level=0;level<3;level++){box(g,x,.65+level*1.1,z,w,.18,2.4,0x99aaa0);for(let k=0;k<7;k++){const xx=x-w*.4+(k%4)*w*.26,zz=z+(k<4?-.6:.6);ball(g,xx,.98+level*1.1,zz,.36,level%2?0x58944b:0x39774b);}box(g,x,1.55+level*1.1,z,w,.08,.15,0xd9e5bd);}for(const xx of [-w/2,w/2])box(g,x+xx,2,z,.1,4,.1,palette.metal);}
  for(let i=0;i<5;i++){
    const f=new T.Group();f.name='B'+(i+1);f.userData.floor=i;model.add(f);floors.push(f);const width=126;
    box(f,0,-.55,0,width,1.1,38,palette.slab);box(f,0,.75,-18.7,width,1.5,.4,palette.wall);
    // Rear, walkable, accessible utility aisle and segregated service lines.
    for(let j=0;j<3;j++)pipe(f,[-width/2+1,2.9+j*.35,-17.4],[width/2-1,2.9+j*.35,-17.4],.12,[0x528faf,0xc59c62,0x749879][j]);
    for(let x=-48;x<=48;x+=16){box(f,x,1.4,-17,2.4,2.5,.6,palette.metal);box(f,x,1.65,-16.64,1.9,1.4,.05,0x89999e);}
    box(f,0,-.4,23,17,.8,9,palette.slab);box(f,-7.9,2.8,23,.25,5.6,8,palette.wall);box(f,-.2,2.8,23,.25,5.6,8,palette.wall);box(f,7.9,2.8,23,.25,5.6,8,palette.wall);
    for(let k=0;k<18;k++){box(f,-5.6,.12+k*.25,26-k*.36,2.7,.22,.4,palette.wall);box(f,-2.4,4.62+k*.25,20+k*.36,2.7,.22,.4,palette.wall);}box(f,-4,4.5,19.65,6,.24,1.1,palette.wall);pipe(f,[-7,1,26],[-7,5.4,19.8],.065,palette.metal);pipe(f,[-1,5.5,19.8],[-1,9.8,26],.065,palette.metal);
    box(f,4,2.5,23,6,5,6,palette.metal);door(f,4,26.1,3.6);door(f,-4,18.7,2.2);door(f,4,18.7,2.2);
    box(f,60,-.4,0,5,.8,38,palette.slab);box(f,62.5,1,0,.3,2,38,palette.wall);door(f,60,16,2.5);
    for(let k=0;k<12;k++)box(f,60,.1+k*.4,-10-k*.55,3.5,.2,.65,palette.wall);
