<div id="bunker-viewer">
  <div class="viz-row"><span class="viz-badge">五层深埋模型</span><span class="text-small">九车位车库 · 共墙生活区 · 加深储备层</span></div>
  <div class="viz-controls" id="floor-controls" aria-label="查看楼层">
    <button class="btn" data-floor="all" aria-pressed="true">整体</button>
    <button class="btn" data-floor="0" aria-pressed="false">B1 车库与生活</button>
    <button class="btn" data-floor="1" aria-pressed="false">B2 医疗休闲</button>
    <button class="btn" data-floor="2" aria-pressed="false">B3 农业</button>
    <button class="btn" data-floor="3" aria-pressed="false">B4 仓储</button>
    <button class="btn" data-floor="4" aria-pressed="false">B5 水电</button>
  </div>
  <div class="viz-controls">
    <label class="form-label">楼层展开 <output id="gap-value">0</output><input id="gap" class="form-range" type="range" min="0" max="14" value="0"></label>
    <label class="form-check"><input id="rock" class="form-check-input" type="checkbox" checked><span class="form-check-label">深埋岩层</span></label>
    <label class="form-check"><input id="labels" class="form-check-input" type="checkbox" checked><span class="form-check-label">空间标注</span></label>
    <label class="form-check"><input id="route" class="form-check-input" type="checkbox" checked><span class="form-check-label">无人机转运路线</span></label>
    <button id="home" class="btn">总览视角</button><button id="top" class="btn">俯视</button>
  </div>
  <div class="viz-controls"><button id="walk-toggle" class="btn" aria-pressed="false">进入第一人称</button><button id="walk-up" class="btn" disabled>电梯：上一层</button><button id="walk-down" class="btn" disabled>电梯：下一层</button><span id="walk-status" class="text-small">剖面模式</span></div>
  <div id="model-stage"><canvas id="model-canvas" tabindex="0" aria-label="堡垒三维模型。剖面模式拖动旋转；漫游模式拖动转头，WASD 或方向键移动，Escape 返回剖面。"></canvas><span id="crosshair" hidden aria-hidden="true">＋</span><span id="ammo-hud" hidden></span><div id="model-labels" aria-hidden="true"></div><div id="model-message" role="status">正在构建三维空间…</div></div>

  <div class="viz-controls" id="game-actions"><button class="btn" id="mouse-lock">锁定鼠标</button><button class="btn" id="interact">互动 / 开门 E</button><button class="btn" id="drive">驾驶 / 下车 F</button><button class="btn" id="pickup">拿起物品 E</button><button class="btn" id="drop">放下 Q</button><button class="btn" id="shoot">射击</button><button class="btn" id="reload">换弹 R</button><button class="btn" id="drone-hatch">隐蔽起降井：开合</button><span id="game-status" class="text-small" role="status">选择车辆可驾驶、改装；进入第一人称后靠近物品或门按 E。</span></div>
  <div id="walk-pad" class="viz-controls" hidden><button class="btn" data-move="forward">前进 ↑</button><button class="btn" data-move="left">左移 ←</button><button class="btn" data-move="back">后退 ↓</button><button class="btn" data-move="right">右移 →</button><span class="text-small">拖动画面转头 · WASD 移动 · 常闭门按 E 开启 · F 驾驶 · R 换弹 · Q 放下 · Esc 退出</span></div>
  <div class="viz-controls"><label class="form-label">选择空间<select class="form-select" id="room-select"><option value="">点击模型或选择空间</option></select></label><button class="btn" id="focus-room">聚焦所选空间</button><button class="btn" id="export-model">导出 OBJ 模型</button><button class="btn" id="export-image">保存当前视角</button></div>
  <div class="viz-controls"><label class="form-label">选择物品<select class="form-select" id="item-select"><option value="">点击车辆、家具或设备</option></select></label><button id="blast-door" class="btn" aria-pressed="false">开合车库隔断门</button></div>
  <section id="item-inspector" class="card" hidden><div id="item-title"></div><p id="item-description" class="text-small"></p><div class="viz-controls"><label class="form-label">替换款式<select id="item-variant" class="form-select"><option value="0">原始款式</option><option value="1">替换款式</option></select></label><label class="form-label">外观<select id="item-color" class="form-select"><option value="original">原始配色</option><option value="slate">石墨灰</option><option value="olive">橄榄绿</option><option value="sand">砂岩色</option></select></label><button id="item-apply" class="btn">应用替换</button><button id="item-reset" class="btn">恢复此物品</button><button id="item-focus" class="btn">近看物品</button></div><div id="vehicle-mods" class="viz-controls" hidden><label class="form-label">防护外观<select class="form-select" id="mod-armor"><option value="0">原车</option><option value="1">防护板与窗网</option><option value="2">末日远征外观</option></select></label><label class="form-check"><input type="checkbox" class="form-check-input" id="mod-tires"><span class="form-check-label">越野轮胎</span></label><label class="form-check"><input type="checkbox" class="form-check-input" id="mod-rack"><span class="form-check-label">车顶补给架</span></label><label class="form-check"><input type="checkbox" class="form-check-input" id="mod-lights"><span class="form-check-label">辅助灯组</span></label><button class="btn" id="apply-mods">应用车辆改装</button></div><span id="item-save-status" class="text-small">替换仅保存在本浏览器；可随 OBJ 导出。</span></section>
  <p id="room-detail" aria-live="polite">拖动旋转 · 滚轮缩放 · 右键拖动平移 · 双指缩放 · 点击房间查看说明</p>
  <p class="text-small">深埋空间概念模型；枪械交互为虚构游戏效果。尺寸、埋深、结构、防护等级和 200 年保障能力均未核算。</p>
</div>
<style>
#bunker-viewer{--stage-bg:var(--background);width:100%;color:var(--foreground)}
#bunker-viewer [hidden]{display:none!important}
#bunker-viewer .viz-controls{margin-block:12px}#model-stage{position:relative;height:650px;overflow:hidden;background:var(--stage-bg)}
#model-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#model-canvas:active{cursor:grabbing}
#model-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.model-tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:var(--foreground);background:var(--background);padding:3px 6px;border:1px solid var(--border);border-radius:3px;font-size:12px}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--foreground);pointer-events:none}#ammo-hud{position:absolute;right:16px;bottom:16px;color:var(--foreground);background:var(--background);padding:8px;pointer-events:none}
#model-message{position:absolute;inset:45% 12% auto;text-align:center;pointer-events:none;color:var(--foreground)}
#room-detail{min-height:2.8em}#bunker-viewer select{max-width:100%}@media(max-width:650px){#model-stage{height:500px}.model-tag{font-size:11px}#bunker-viewer .viz-controls{gap:8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  'use strict';
  const root=document.getElementById('bunker-viewer'), $=id=>root.querySelector('#'+id);
  if(!window.THREE){$('model-message').textContent='三维组件未能加载。请使用完整离线包打开。';return;}
  const T=window.THREE, canvas=$('model-canvas'), stage=$('model-stage');
  let renderer;
  try{renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});}catch(e){$('model-message').textContent='浏览器未能启用 WebGL，请开启硬件加速后重新打开。';return;}
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;if(renderer.shadowMap){renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;}
  const scene=new T.Scene(), model=new T.Group();scene.add(model);
  const camera=new T.PerspectiveCamera(38,1,.1,1800), light=new T.DirectionalLight(0xfff0d8,2.7);light.position.set(-50,120,100);light.castShadow=true;light.shadow.mapSize.set(1024,1024);Object.assign(light.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:1,far:400});light.shadow.camera.updateProjectionMatrix();light.shadow.bias=-.0004;scene.add(camera);scene.add(light,new T.HemisphereLight(0xd7ebff,0x72624d,1.8));
  const fill=new T.DirectionalLight(0xa4c9ff,1.3);fill.position.set(80,35,-50);scene.add(fill);
  const palette={slab:0x667785,wall:0xb4b6af,metal:0x374b5b,wood:0xa0764c,blue:0x3688af,green:0x467e55,yellow:0xe4b955,cloth:0xe0c8a2,dark:0x20303d};

  function surfaceTexture(metal){const n=64,data=new Uint8Array(n*n*4);let seed=metal?1249:678;for(let y=0;y<n;y++)for(let x=0;x<n;x++){seed=(seed*1664525+1013904223)>>>0;const noise=(seed>>>24)/255,patch=Math.sin(x*.19)*Math.sin(y*.23),v=Math.round((metal?205:222)+noise*25+patch*13),i=(y*n+x)*4;data[i]=v;data[i+1]=v-(metal&&patch>.5?10:0);data[i+2]=v-(metal&&patch>.5?24:0);data[i+3]=255;}const t=new T.DataTexture(data,n,n,T.RGBAFormat);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(metal?2:4,metal?2:4);t.needsUpdate=true;return t;}

  const doors=[],walkWalls=[],ceilings=[],floorRoomLists=[[],[],[],[],[]],items=[];
  function registerItem(group,type,label){let a=group.parent,floor=0,roomId=null;while(a){if(a.userData.room!==undefined)roomId=a.userData.room;if(a.userData.floor!==undefined)floor=a.userData.floor;a=a.parent;}const item={id:String(items.length),group,type,label,floor,roomId,variant:0,color:'original'};group.userData.itemId=item.id;items.push(item);return group;}
  function itemGroup(p,x,z,type,label){const g=new T.Group();g.position.set(x,0,z);g.name=type+'-'+items.length;p.add(g);return registerItem(g,type,label);}
  const boxGeo=new T.BoxGeometry(1,1,1), cylGeo=new T.CylinderGeometry(1,1,1,24), sphereGeo=new T.SphereGeometry(1,12,8);
  function box(p,x,y,z,w,h,d,c){const m=new T.Mesh(boxGeo,mat(c));m.position.set(x,y,z);m.scale.set(w,h,d);m.receiveShadow=true;p.add(m);return m;}
  function cyl(p,x,y,z,r,h,c){const m=new T.Mesh(cylGeo,mat(c));m.position.set(x,y,z);m.scale.set(r,h,r);p.add(m);if(p.userData.room!==undefined&&r>=1&&h>=1)registerItem(m,'tank','储罐／处理容器');return m;}
  function ball(p,x,y,z,r,c){const m=new T.Mesh(sphereGeo,mat(c));m.position.set(x,y,z);m.scale.setScalar(r);p.add(m);return m;}
  function pipe(p,a,b,r,c){const av=new T.Vector3(...a),bv=new T.Vector3(...b),delta=bv.clone().sub(av);const m=cyl(p,0,0,0,r,delta.length(),c);m.position.copy(av.add(bv).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());return m;}

  // Bevelled volumes and profiled bodywork replace the original plain cuboids.
  function bevel(p,x,y,z,w,h,d,c,r=.08){const shape=new T.Shape(),a=w/2,b=h/2;shape.moveTo(-a+r,-b);shape.lineTo(a-r,-b);shape.quadraticCurveTo(a,-b,a,-b+r);shape.lineTo(a,b-r);shape.quadraticCurveTo(a,b,a-r,b);shape.lineTo(-a+r,b);shape.quadraticCurveTo(-a,b,-a,b-r);shape.lineTo(-a,-b+r);shape.quadraticCurveTo(-a,-b,-a+r,-b);const geo=new T.ExtrudeGeometry(shape,{depth:d-2*r,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:r,bevelThickness:r,curveSegments:4});geo.translate(0,0,-(d-2*r)/2);const m=new T.Mesh(geo,mat(c));m.position.set(x,y,z);p.add(m);return m;}
  function profile(p,points,width,c){const s=new T.Shape();s.moveTo(points[0][0],points[0][1]);points.slice(1).forEach(q=>s.lineTo(q[0],q[1]));s.closePath();const geo=new T.ExtrudeGeometry(s,{depth:width,bevelEnabled:true,bevelSize:.05,bevelThickness:.05,bevelSegments:2,steps:1});geo.rotateY(-Math.PI/2);geo.translate(width/2,0,0);const m=new T.Mesh(geo,mat(c));p.add(m);return m;}
  function wheel(p,x,y,z,r=.72){const tire=new T.Mesh(new T.TorusGeometry(r*.73,r*.27,8,24),mat(0x1c2428));tire.rotation.y=Math.PI/2;tire.position.set(x,y,z);p.add(tire);const hub=cyl(p,x,y,z,r*.46,.42,0x9da9ae);hub.rotation.z=Math.PI/2;for(let k=0;k<12;k++){const t=k*Math.PI/6;const tread=box(p,x,y+Math.cos(t)*r,z+Math.sin(t)*r,.44,.12,.22,0x30393b);tread.rotation.x=-t;}}
  function offroad(parent,x,z,heavy=false){const v=itemGroup(parent,x,z,'offroad',heavy?'改装重型越野车':'改装轻型越野车');v.name=heavy?'heavy-offroad':'light-offroad';const scale=heavy?1.22:1;v.scale.setScalar(scale);v.userData.heavy=heavy;
    bevel(v,0,.72,0,2.3,.32,5.6,palette.dark);profile(v,[[-2.7,1],[-2.7,1.55],[-1.65,1.7],[-1.2,2.4],[1.2,2.45],[1.7,1.65],[2.65,1.45],[2.7,1]],2.35,heavy?0x68745f:0xafb3a1);
    bevel(v,0,1.65,-1.65,2.3,.2,1.7,0x839382);for(const xx of [-1.2,1.2]){for(const zz of [-1.7,1.7])wheel(v,xx,.76,zz,.76);for(const zz of [-.58,.65]){bevel(v,xx,2.06,zz,.04,.54,.98,0x284c5e,.015);box(v,xx*1.02,1.5,zz,.04,.03,.28,palette.metal);}pipe(v,[xx,.45,-1],[xx,.45,1],.07,palette.dark);}
    const glass=bevel(v,0,2.03,1.43,2.06,.64,.04,0x315f74,.02);glass.rotation.x=.39;bevel(v,0,2.08,-1.35,2.05,.48,.04,0x315f74,.02);
    for(const zz of [-2.8,2.8]){bevel(v,0,.9,zz,2.65,.25,.35,palette.metal);pipe(v,[-1.1,1.15,zz],[1.1,1.15,zz],.085,palette.dark);}cyl(v,0,.98,2.99,.16,.48,0x9ba7a8).rotation.z=Math.PI/2;
    for(const xx of [-.82,.82]){const lamp=ball(v,xx,1.32,2.7,.19,0xf4e0a5);lamp.scale.z=.35;pipe(v,[xx,2.53,-1.2],[xx,2.53,1.2],.045,palette.dark);}for(const zz of [-1.15,0,1.15])pipe(v,[-.9,2.53,zz],[.9,2.53,zz],.045,palette.metal);
    for(let k=0;k<3;k++)bevel(v,-.6+k*.6,2.74,-.4,.45,.3,.8,0x8c846c,.05);pipe(v,[1.27,1.4,1.2],[1.27,2.7,1.2],.09,palette.dark);pipe(v,[1.27,2.7,1.2],[1.27,2.7,.8],.09,palette.dark);
    const spare=new T.Mesh(new T.TorusGeometry(.51,.2,8,24),mat(0x20292b));spare.position.set(0,1.65,-2.85);v.add(spare);return v;}

  function door(p,x,z,w=2.1){const frame=new T.Group();frame.name='automatic-compartment-door';frame.position.set(x,0,z);p.add(frame);const leaves=[];for(const side of [-1,1]){const leaf=new T.Group();leaf.position.x=side*w/4;frame.add(leaf);box(leaf,0,1.45,0,w/2-.03,2.9,.28,palette.metal);box(leaf,0,1.45,.17,w/2-.18,2.5,.05,0x526777);box(leaf,-side*w*.13,1.4,.25,.08,.5,.08,palette.yellow);leaf.traverse(o=>o.userData.walkDoor=true);leaves.push({group:leaf,side,base:side*w/4});}box(frame,0,3,0,w+.35,.18,.6,palette.wall);for(const dx of [-w/2-.1,w/2+.1])box(frame,dx,1.5,0,.16,3,.6,palette.wall);const sensor=box(frame,0,3.2,.15,.6,.14,.18,0x73b9a4);doors.push({frame,leaves,width:w,open:0,sensor});return frame;}
  function cutWall(p,x,z,w,d,h=3.6){const m=box(p,x,.8,z,w,1.6,d,palette.wall);walkWalls.push({mesh:m,height:h});return m;}
  function edge(p,x,y,z,w,h,d){const line=new T.LineSegments(new T.EdgesGeometry(boxGeo),new T.LineBasicMaterial({color:0x394b54,transparent:true,opacity:.24}));line.position.set(x,y,z);line.scale.set(w,h,d);p.add(line);}
  function firearmAlcove(parent,x,z,floorIndex){
    const a=new T.Group();a.name='firearm-storage-alcove';a.position.set(x,0,z);parent.add(a);a.userData.staticStorage=true;
    box(a,0,.17,0,6,.2,5.8,0x778682);for(const xx of [-3,3])box(a,xx,1.9,0,.2,3.8,5.8,palette.wall);box(a,0,1.9,-2.9,6,3.8,.25,palette.wall);
    // Generic external silhouettes only, without operating parts or assembly geometry.
    box(a,-.7,1.6,-1.8,3.9,3.2,1.1,palette.dark);
    for(let i=0;i<4;i++){const gun=new T.Group();gun.name='stored-firearm-silhouette';gun.position.set(-2.1+i*.92,.45,-1.12);a.add(gun);box(gun,0,.35,0,.23,.7,.13,0x7c6954);box(gun,0,1,0,.25,.65,.16,palette.metal);box(gun,0,1.72,0,.1,.95,.1,0x222a30);box(gun,.17,.86,0,.23,.16,.12,0x222a30);}
    const glass=new T.Mesh(boxGeo,new T.MeshPhysicalMaterial({color:0xa4c6cf,transparent:true,opacity:.16,roughness:.2,metalness:.2,depthWrite:false}));glass.position.set(-.7,1.6,-.98);glass.scale.set(3.65,2.9,.04);a.add(glass);
    for(const xx of [-2.65,1.25])box(a,xx,1.6,-.92,.12,3.2,.13,0x73878b);box(a,-.7,1.6,-.89,.1,3.2,.12,0x73878b);box(a,-.43,1.65,-.78,.12,.5,.1,palette.yellow);
    box(a,2,1,-1.7,1.25,2,1.3,palette.metal);for(const yy of [.55,1.4]){box(a,2,yy,-1.02,1,.65,.08,0x687f87);box(a,2.3,yy,-.94,.16,.09,.1,palette.yellow);}
    box(a,-1.9,1.85,2.9,2.2,3.7,.18,palette.wall);box(a,2,1.85,2.9,2,3.7,.18,palette.wall);door(a,0,2.9,1.6);
    tag('独立枪械储存',a,[0,4.2,0],floorIndex,parent.userData.room);
    return a;
  }
  const floors=[],rooms=[],tags=[],floorNames=['车库 · 无人机 · 总控 · 生活','医疗 · 休闲 · 训练','农业 · 育苗 · 水产','大型仓储 · 维修','储水 · 净化 · 能源'];
  const floorColors=[0x8b907d,0x9bafba,0x73a977,0x938b7c,0x5f9fbe];
  function tag(text,p,pos,floor,room=null){const el=document.createElement('span');el.className='model-tag';el.textContent=text;$('model-labels').append(el);tags.push({el,parent:p,position:new T.Vector3(...pos),floor,room});}
  function room(f,name,x,z,w,d,description){const g=new T.Group();g.name='B'+(f.userData.floor+1)+'_room_'+rooms.length;g.position.set(x,0,z);f.add(g);const item={id:String(rooms.length),name,floor:f.userData.floor,group:g,x,z,w,d,description};const roomHeight=(item.floor===0||item.floor===4)?6.2:4.4;g.userData.room=item.id;const prev=rooms.filter(r=>r.floor===item.floor).at(-1);rooms.push(item);
    item.pad=box(g,0,.08,0,w,.16,d,floorColors[item.floor]);edge(g,0,.08,0,w,.16,d);
    const sharedLeft=prev&&Math.abs(prev.x+prev.w/2-(x-w/2))<.05;
    if(name==='九车位车辆库'){const c=6,half=4.5;cutWall(g,-w/2,(-d/2+c-half)/2,.35,c-half+d/2,roomHeight);cutWall(g,-w/2,(c+half+d/2)/2,.35,d/2-c-half,roomHeight);const entry=door(g,-w/2,c,9);entry.rotation.y=Math.PI/2;entry.scale.y=1.8;entry.name='garage-side-vehicle-door';}else if(!sharedLeft)cutWall(g,-w/2,0,.25,d,roomHeight);

  $('export-model').addEventListener('click',()=>{model.updateMatrixWorld(true);const lines=['# Bunker conceptual geometry; uncalibrated units.','mtllib bunker.mtl'],materials=new Map();let offset=0;const v=new T.Vector3();model.traverse(o=>{if(!o.isMesh||!visibleUp(o))return;const pos=o.geometry.getAttribute('position');if(!pos)return;const color=o.material.color?.getHexString()||'aaaaaa',opacity=o.material.transparent?o.material.opacity:1,mn='m_'+color+'_'+Math.round(opacity*100);materials.set(mn,{color,opacity});let owner=o;while(owner.parent&&!owner.name)owner=owner.parent;const name=(o.name||owner.name||'part').replace(/[^a-zA-Z0-9_-]/g,'_');lines.push('o '+name+'_'+offset,'usemtl '+mn);for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);lines.push('v '+v.x.toFixed(3)+' '+v.y.toFixed(3)+' '+v.z.toFixed(3));}const ix=o.geometry.index,count=ix?ix.count:pos.count;for(let i=0;i<count;i+=3)lines.push('f '+[0,1,2].map(k=>offset+(ix?ix.getX(i+k):i+k)+1).join(' '));offset+=pos.count;});const mtl=[...materials].map(([n,m])=>{const cc=new T.Color('#'+m.color);return 'newmtl '+n+'\nKd '+cc.r+' '+cc.g+' '+cc.b+'\nd '+m.opacity+'\n';}).join('\n');download(lines.join('\n'),'bunker.obj','text/plain');setTimeout(()=>download(mtl,'bunker.mtl','text/plain'),300);$('room-detail').textContent='已导出当前可见楼层的 OBJ 和 MTL，包含分组名称与柜门透明度。两个文件请放在同一目录；尺寸未经标定。';});
